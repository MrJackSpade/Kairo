name: Kairo Discord release announcement
description: Announce one of the calling repository's GitHub releases in the Kairo Discord releases channel
inputs:
  webhook:
    description: The Kairo Discord releases channel's webhook (a secret)
    required: true
  tag:
    description: The release tag to announce
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        DISCORD_RELEASE_WEBHOOK: ${{ inputs.webhook }}
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ inputs.tag }}
        KAIRO_ACTION_PATH: ${{ github.action_path }}
      run: python3 "$KAIRO_ACTION_PATH/release.py" "$TAG"
