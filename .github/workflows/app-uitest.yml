name: Kairo app UI tests

# Every Kairo app's UI test suite (shared/uitest, the app's uitest module) on the Android emulator
# (Kairo#114), called by the app's uitest.yml with `uses:
# MrJackSpade/Kairo/.github/workflows/app-uitest.yml@<pinned commit>` and `secrets: inherit`. It runs
# shared/tools/uitest.ps1 -Emulator, as a local run does: shared/tools/emulator.ps1 creates the AVD
# (the google_apis x86_64 image of the apps' minSdk, Android 8.0, with the Retroid Pocket 6's
# 1920x1080 landscape screen, a hardware keyboard and SwiftShader's GL) and boots it, and the app and
# its tests build for x86_64. The run's logs, screenshots and pictures are kept as a workflow
# artifact, passed or failed.
#
# The app repository provides the secret LOCAL_BUILD_TOKEN, the key of its encrypted UI test
# resources (uitest/TestResources.part1.dat).

on:
  workflow_call:
    inputs:
      filter:
        description: A regular expression over full test names (package.Class#method); every test otherwise
        required: false
        type: string
        default: ''
    secrets:
      LOCAL_BUILD_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  uitest:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Check out the pinned Kairo frontend
        run: |
          git submodule update --init --recursive shared
          bash shared/tools/verify_checkout.sh "$(git rev-parse HEAD:shared)"
      - uses: ./shared/.github/actions/setup-android
        id: android-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the test resources' decryption
        run: python -m pip install cryptography
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run the UI tests on the minimum Android
        env:
          LOCAL_BUILD_TOKEN: ${{ secrets.LOCAL_BUILD_TOKEN }}
          FILTER: ${{ inputs.filter }}
        # As a local run: tools/emulator.ps1 creates and boots the AVD of the minSdk, and the app and
        # its tests build for x86_64. An empty -Filter runs every test.
        run: pwsh -NoProfile -File shared/tools/uitest.ps1 -Emulator -Filter "$FILTER"
      - name: Keep the run's logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: uitest-logs
          path: .build/uitest/
          if-no-files-found: ignore
