name: Kairo app Google Play release

# Publishes a release's Play bundle (from app-release.yml) to Google Play production, called by the
# app's play-release.yml, which app-release.yml dispatches for a tag without a prerelease suffix.
# The Play publishing service account must be able to publish the app, and the workload identity
# pool must accept the app's repository (docs/android-build.md).

on:
  workflow_call:
    inputs:
      name:
        description: The app's name, such as Kairo68
        required: true
        type: string
      package:
        description: The app's application ID, such as com.loxifi.kairo68
        required: true
        type: string
      tag:
        description: Release tag whose Play bundle to publish
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    steps:
      - name: Refuse prerelease tags
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" == *-* ]]; then
            echo "$TAG is a prerelease tag; prereleases never go to Google Play" >&2
            exit 1
          fi
      - uses: actions/checkout@v4
      - name: Check out the pinned Kairo frontend
        run: |
          git submodule update --init --recursive shared
          bash shared/tools/verify_checkout.sh "$(git rev-parse HEAD:shared)"
      - name: Download the release's Play bundle
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          NAME: ${{ inputs.name }}
        run: gh release download "$TAG" --pattern "$NAME-$TAG-play.aab" --dir "$RUNNER_TEMP"
      - uses: ./shared/.github/actions/play-publish
        with:
          package: ${{ inputs.package }}
          bundle: ${{ runner.temp }}/${{ inputs.name }}-${{ inputs.tag }}-play.aab
          track: production
