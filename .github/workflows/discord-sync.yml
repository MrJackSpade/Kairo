name: Discord sync

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to mirror, or to rewrite from GitHub if already mirrored; leave empty to mirror every issue without a thread'
        required: false

permissions:
  contents: write
  issues: read

jobs:
  sync:
    # issue_comment also fires for pull request comments; only issues are mirrored.
    if: ${{ !github.event.issue.pull_request }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: ./.github/actions/discord-sync
        with:
          webhook: ${{ secrets.DISCORD_FORUM_WEBHOOK }}
          bot-token: ${{ secrets.KAIRO_DISCORD_BOT_TOKEN }}
          state: .github/discord-sync/issues
          issue: ${{ inputs.issue }}
