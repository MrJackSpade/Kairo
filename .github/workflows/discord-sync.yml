name: Discord sync

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      issue:
        description: 'Issue number to reconcile with its Discord post; leave empty to reconcile every issue'
        required: false

permissions:
  contents: write
  issues: read

jobs:
  sync:
    uses: ./.github/workflows/discord-sync-run.yml
    with:
      issue: ${{ inputs.issue }}
    secrets:
      webhook: ${{ secrets.DISCORD_FORUM_WEBHOOK }}
      owner-webhook: ${{ secrets.KAIRO_DISCORD_OWNER_WEBHOOK }}
      bot-token: ${{ secrets.KAIRO_DISCORD_BOT_TOKEN }}
